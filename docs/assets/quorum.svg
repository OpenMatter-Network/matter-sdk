<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>The quorum guarantee: any t of n, never one</title>
  <desc>Five committee nodes each hold one piece of the private key. Any three pieces reconstruct the secret; any two reveal nothing. No single node ever holds the full private key.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d4aff"/>
      <stop offset="1" stop-color="#3f23c4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>
    <marker id="pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff85bb"/>
    </marker>
    <g id="key" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round">
      <circle cx="0" cy="-9" r="9"/>
      <line x1="0" y1="0" x2="0" y2="20"/>
      <line x1="0" y1="12" x2="9" y2="12"/>
      <line x1="0" y1="18" x2="6" y2="18"/>
    </g>
  </defs>
  <style>
    text{fill:#ffffff}
    .title{font-weight:700}
    .muted{fill:#cfc8f4}
    .teal{fill:#5fe6d4}
    .pink{fill:#ff85bb}
    .hex{fill:#ffffff;fill-opacity:.06;stroke:#cbb8ff;stroke-opacity:.65;stroke-width:2}
    .conv{stroke:#ff85bb;stroke-width:2.5;fill:none}
    .card{fill:#ffffff;fill-opacity:.06;stroke:#ffffff;stroke-opacity:.2;stroke-width:1.5}
  </style>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="1400" cy="80" rx="540" ry="360" fill="#ffffff" fill-opacity="0.045"/>

  <text class="teal" x="800" y="84" text-anchor="middle" font-size="18" letter-spacing="6">THE QUORUM GUARANTEE</text>
  <text class="title" x="800" y="150" text-anchor="middle" font-size="48">Any 3 of 5. Never one.</text>
  <text class="muted" x="800" y="192" text-anchor="middle" font-size="20">5 committee nodes — each holds one piece of the private key</text>

  <!-- converging lines (active nodes -> centre) -->
  <path class="conv" d="M300,358 L772,560" marker-end="url(#pink)"/>
  <path class="conv" d="M550,358 L792,548" marker-end="url(#pink)"/>
  <path class="conv" d="M1050,358 L828,560" marker-end="url(#pink)"/>
  <text class="pink" x="1015" y="466" text-anchor="middle" font-size="19">any 3 pieces</text>

  <!-- active nodes -->
  <polygon class="hex" points="300,245 252.37,272.5 252.37,327.5 300,355 347.63,327.5 347.63,272.5"/>
  <use href="#key" transform="translate(300,300) scale(0.85)"/>
  <polygon class="hex" points="550,245 502.37,272.5 502.37,327.5 550,355 597.63,327.5 597.63,272.5"/>
  <use href="#key" transform="translate(550,300) scale(0.85)"/>
  <polygon class="hex" points="1050,245 1002.37,272.5 1002.37,327.5 1050,355 1097.63,327.5 1097.63,272.5"/>
  <use href="#key" transform="translate(1050,300) scale(0.85)"/>

  <!-- dim nodes -->
  <g opacity="0.32">
    <polygon class="hex" points="800,245 752.37,272.5 752.37,327.5 800,355 847.63,327.5 847.63,272.5"/>
    <use href="#key" transform="translate(800,300) scale(0.85)"/>
    <polygon class="hex" points="1300,245 1252.37,272.5 1252.37,327.5 1300,355 1347.63,327.5 1347.63,272.5"/>
    <use href="#key" transform="translate(1300,300) scale(0.85)"/>
  </g>

  <!-- centre: secret decrypted -->
  <polygon points="800,540 730.72,580 730.72,660 800,700 869.28,660 869.28,580" fill="url(#accent)"/>
  <use href="#key" transform="translate(800,618) scale(1.5)"/>
  <text class="title" x="800" y="748" text-anchor="middle" font-size="24">secret decrypted</text>

  <!-- side cards -->
  <rect class="card" x="90" y="560" width="300" height="150" rx="16"/>
  <text class="title" x="240" y="618" text-anchor="middle" font-size="24">Any 2 pieces</text>
  <text class="muted" x="240" y="654" text-anchor="middle" font-size="17">reveal nothing</text>
  <text class="muted" x="240" y="678" text-anchor="middle" font-size="17">about the secret</text>

  <rect class="card" x="1210" y="560" width="300" height="150" rx="16"/>
  <text class="title" x="1360" y="618" text-anchor="middle" font-size="24">No single node</text>
  <text class="muted" x="1360" y="654" text-anchor="middle" font-size="17">ever holds the</text>
  <text class="muted" x="1360" y="678" text-anchor="middle" font-size="17">full private key</text>

  <text class="muted" x="800" y="850" text-anchor="middle" font-size="22">Trust the math, not any one operator.</text>
</svg>
