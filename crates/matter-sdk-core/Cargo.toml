[package]
name = "matter-sdk-core"
description = "Pure, non-networked cryptographic core for MatterSDK: seal secrets under the matter-kgc joint key and open them from a collected committee quorum. The single source of cryptographic truth shared by every MatterSDK language binding."
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
# `rlib` only: each binding links the core into its own cdylib/staticlib. Adding
# `cdylib` here needs a target linker and breaks cross-compiled FFI archives.
crate-type = ["rlib"]

[dependencies]
# RLWE/BGV threshold crypto. Wrapped, never re-implemented.
matter-crypto = { workspace = true }
# `/partial-decrypt` wire types + signing payload, shared with the committee node.
matter-kgc-proto = { workspace = true }
# Versioned proof codec + on-chain size bounds.
matter-kgc-config = { workspace = true, features = ["wire"] }

serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
once_cell = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Route `OsRng` through `crypto.getRandomValues` when compiled to wasm.
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
