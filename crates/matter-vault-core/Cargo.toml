[package]
name = "matter-vault-core"
description = "Pure, non-networked cryptographic core for MatterVault: seal secrets under the matter-kgc joint key and open them from a collected committee quorum. The single source of cryptographic truth shared by every MatterSDK language binding."
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
# `rlib` for the native Rust SDK + tests; `cdylib` so the same core compiles to
# wasm32 (the wasm binding) and to a C ABI staticlib (the Go binding).
crate-type = ["cdylib", "rlib"]

[dependencies]
# The novel RLWE/BGV threshold crypto. We wrap it; we never re-implement it.
matter-crypto = { workspace = true }
# `/partial-decrypt` wire types + the canonical request-signing payload, so every
# binding signs and serializes the exact bytes the committee node verifies.
matter-kgc-proto = { workspace = true }
# Versioned proof codec (`wire::{encode,decode}_tagged`) + on-chain size bounds.
matter-kgc-config = { workspace = true, features = ["wire"] }

serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
once_cell = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Route `OsRng` through `crypto.getRandomValues` when compiled to wasm.
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
