[package]
name = "matter-sdk-key"
description = "Key ingestion and signing for MatterSDK: parses an OpenMatter API key (0x mini-secret, BIP39 mnemonic, or sr25519 SURI) into a zeroizing, redacted, non-serializable signer. No networking and no chain client, so it compiles to wasm32 and is shared by every language binding."
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hex = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

# No default features: keeps the `subxt` client out so this crate builds for wasm32.
subxt-signer = { version = "0.44.0", default-features = false, features = ["sr25519"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# sr25519 signing needs an RNG; on wasm32 it comes from `crypto.getRandomValues`.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
# The `#[ignore]`d emitter writes testvectors/api_keys.json.
serde_json = { workspace = true }
# Oracle for `src/suri.rs` in `tests/suri_equivalence.rs`; as a dev-dependency its
# `SecretUri` (and `regex`) stays out of the wasm artifact.
subxt-signer = { version = "0.44.0", default-features = false, features = ["sr25519"] }

[lints]
workspace = true
