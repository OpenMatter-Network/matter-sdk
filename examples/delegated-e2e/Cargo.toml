[package]
name = "matter-delegated-e2e"
description = "Exercise a member-tied scoped API key end to end: resolved mode, a wrapped write, and the two refusals a key should get. Read-only unless MATTER_SUBMIT=yes."
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "delegated-e2e"
path = "src/main.rs"

[dependencies]
matter-vault = { path = "../../crates/matter-vault", features = ["chain"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[lints]
workspace = true
