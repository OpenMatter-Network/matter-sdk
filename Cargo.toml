# Workspace root for MatterSDK — the polyglot client SDK for MatterChain and
# the OpenMatter platform. Threshold Secrets (the matter-kgc committee) is one
# of the features it covers, not the whole of it.
#
# Layout (see README.md for the full picture):
#   crates/matter-sdk-core/ — PURE, non-networked crypto + wire contract.
#                               The single source of cryptographic truth; the
#                               source for every language binding.
#   crates/matter-sdk-key/  — API-key ingestion + the KeySigner capability.
#                               Also non-networked and wasm32-clean, so the TS
#                               binding shares this derivation instead of
#                               re-implementing it in @polkadot/util-crypto.
#   crates/matter-sdk/      — the Rust SDK: committee HTTP client, quorum
#                               orchestration, Signer abstraction, call builders.
#   crates/matter-sdk-ffi/  — C ABI (cdylib) over the core, for the Go binding.
#   bindings/wasm/            — wasm-bindgen binding over the core (drives the TS SDK).
#   bindings/python/          — PyO3/maturin binding over the cores + a pure-Python
#                               online layer (chain client via the [sdk] extra).
#
# Dependency policy
# -----------------
# The novel RLWE/BGV threshold cryptography lives in `matter-crypto`; the HTTP
# wire types live in `matter-kgc-proto`; the on-chain config + versioned proof
# codec live in `matter-kgc-config`. We DEPEND on those — we never re-implement
# them (one audited implementation, no cross-language drift).
#
# They are pinned as GIT-TAG dependencies (the matter-kgc convention) — see
# [workspace.dependencies] below. Locally they fetch over SSH with your GitHub
# credentials (.cargo/config.toml sets net.git-fetch-with-cli); CI rewrites the
# remotes to HTTPS + PAT via .github/actions/fetch-core-crates. Bump the tags
# here and in Cargo.lock together.

[workspace]
members = ["crates/matter-sdk-core", "crates/matter-sdk-key", "crates/matter-sdk", "crates/matter-sdk-ffi", "examples/rust", "examples/rust-e2e", "examples/client-rust", "examples/delegated-e2e"]
# The wasm and python bindings build through their own toolchains (wasm-pack,
# maturin), so they are excluded from the native workspace to keep `cargo build
# --workspace` native-only.
exclude = ["bindings/wasm", "bindings/python"]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
authors = ["Open Matter <admin@openmatter.network>"]
version = "2.0.0"
homepage = "https://openmatter.network"
repository = "https://github.com/openmatter-network/matter-sdk"
edition = "2021"
# Floor lowered from 1.93 so the matter-ml agent (workspace pinned to
# nightly-2025-07-15 = 1.90 for matter-ml-offline) can consume matter-sdk
# as a git-tag dependency. Nothing in the workspace needs post-1.90 rustc;
# restore a higher floor only alongside a matter-ml toolchain bump.
rust-version = "1.90"

[workspace.dependencies]
# --- The cryptographic core we wrap (never re-implement). ---
matter-crypto = { git = "ssh://git@github.com/openmatter-network/matter-crypto.git", tag = "v0.8.1", default-features = false }
# Wire types moved out of matter-crypto into the matter-kgc repo; pinned by tag.
matter-kgc-proto = { git = "ssh://git@github.com/openmatter-network/matter-kgc.git", tag = "v0.10.0", default-features = false }
# On-chain config mirror + the `wire` codec (versioned tag ⇄ bincode pairing)
# the provider uses to decode `EncryptedEnv.proof`. Same repo/tag as the proto.
matter-kgc-config = { git = "ssh://git@github.com/openmatter-network/matter-kgc.git", tag = "v0.10.0", default-features = false }

# --- Local crates. ---
matter-sdk-core = { path = "crates/matter-sdk-core", default-features = false }
matter-sdk-key = { path = "crates/matter-sdk-key", default-features = false }

# --- Shared third-party deps (versions aligned with the matter-kgc workspace). ---
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.132" }
bincode = "1.3"
hex = "0.4"
thiserror = "2"
zeroize = { version = "1", features = ["alloc", "derive"] }
rand = "0.8"
once_cell = "1"

[workspace.lints]
rust.missing_docs = "deny"
clippy.all = "deny"

[profile.release]
opt-level = 3

# The static archives shipped in the Go module (scripts/build-ffi-staticlib.sh). Six of
# them are committed to matter-sdk-go on every release, so size is a real cost: without
# LTO the archive carries all of std and every dependency, used or not (30 MB).
#
# The profile alone shrinks nothing. matter-sdk-ffi also declares `rlib`, and cargo
# silently skips LTO for any crate that does — so the script builds with
# `cargo rustc --crate-type staticlib`, which is what lets this take effect.
# opt-level stays at 3: lattice arithmetic is not the place to trade speed for bytes unmeasured.
[profile.release-ffi]
inherits = "release"
lto = "fat"
codegen-units = 1
