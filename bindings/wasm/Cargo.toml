[package]
name = "matter-sdk-wasm"
description = "wasm-bindgen binding over matter-sdk-core: the cryptographic core of MatterSDK for JS/TS, built into the @openmatter-network/matter-sdk-core package."
version = "2.1.2-rc.1"
license = "Apache-2.0"
authors = ["Open Matter <admin@openmatter.network>"]
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The single cryptographic core, shared with the Rust SDK and every other binding.
matter-sdk-core = { path = "../../crates/matter-sdk-core" }
# The single API-key ingestion + sr25519 signing implementation, likewise shared.
# Deriving keys here rather than in @polkadot/util-crypto is what keeps
# TypeScript from drifting away from `testvectors/api_keys.json`.
matter-sdk-key = { path = "../../crates/matter-sdk-key" }

wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
console_error_panic_hook = { version = "0.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["panic-hook"]
panic-hook = ["dep:console_error_panic_hook"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory"]
