[package]
name = "matter-sdk-wasm"
description = "wasm-bindgen binding over matter-sdk-core: the cryptographic core of MatterSDK for JS/TS, built into the @openmatter-network/matter-sdk-core package."
version = "2.3.1"
license = "Apache-2.0"
authors = ["Open Matter <admin@openmatter.network>"]
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
matter-sdk-core = { path = "../../crates/matter-sdk-core" }
matter-sdk-key = { path = "../../crates/matter-sdk-key" }

wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
console_error_panic_hook = { version = "0.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["panic-hook"]
panic-hook = ["dep:console_error_panic_hook"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory"]

# Outside the workspace, so `[workspace.lints]` is not inherited.
[lints]
rust.missing_docs = "deny"
clippy.all = "deny"
