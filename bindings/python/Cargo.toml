[package]
name = "matter-sdk-python"
description = "PyO3 binding over matter-sdk-core for the Python MatterSDK SDK."
version = "2.0.0"
license = "Apache-2.0"
authors = ["Open Matter <admin@openmatter.network>"]
edition = "2021"
publish = false

[lib]
name = "matter_sdk"
crate-type = ["cdylib"]

[dependencies]
matter-sdk-core = { path = "../../crates/matter-sdk-core" }
# API-key ingestion, so Python shares the derivation every other binding uses
# rather than re-deriving with substrate-interface.
matter-sdk-key = { path = "../../crates/matter-sdk-key" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
