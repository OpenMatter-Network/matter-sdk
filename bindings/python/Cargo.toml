[package]
name = "matter-sdk-python"
description = "PyO3 binding over matter-sdk-core and matter-sdk-key for the MatterSDK Python package."
version = "2.3.0"
license = "Apache-2.0"
authors = ["Open Matter <admin@openmatter.network>"]
edition = "2021"
publish = false

[lib]
name = "matter_sdk"
crate-type = ["cdylib"]

[dependencies]
matter-sdk-core = { path = "../../crates/matter-sdk-core" }
matter-sdk-key = { path = "../../crates/matter-sdk-key" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

# Mirrors `[workspace.lints]`, which this out-of-workspace crate does not inherit.
[lints]
rust.missing_docs = "deny"
clippy.all = "deny"
