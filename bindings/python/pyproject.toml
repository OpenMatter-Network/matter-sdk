[build-system]
# >=1.9.2: PEP 639 license metadata (License-Expression, license-files).
requires = ["maturin>=1.9.2,<2"]
build-backend = "maturin"

[project]
name = "matter-sdk"
# maturin reads the version from Cargo.toml and spells it for PEP 440 itself
# (2.1.1-rc.1 -> 2.1.1rc1). A static copy here was a second home for the version, and
# one that cannot hold a release candidate in the form the other manifests use.
dynamic = ["version"]
description = "Python SDK for OpenMatter: threshold secret management on the matter-kgc committee, plus a MatterChain client (generic tx/query/runtime_api and typed façades) via the [sdk] extra."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Open Matter", email = "admin@openmatter.network" }]
requires-python = ">=3.9"
keywords = ["openmatter", "matterchain", "threshold-cryptography", "secrets", "substrate"]
# No "License ::" classifier: PEP 639 forbids one alongside a license expression.
# No Windows classifier: wheels are built for Linux (glibc, musl) and macOS only.
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://openmatter.network"
Repository = "https://github.com/OpenMatter-Network/matter-sdk"
Documentation = "https://github.com/OpenMatter-Network/matter-sdk/tree/main/bindings/python#readme"
Issues = "https://github.com/OpenMatter-Network/matter-sdk/issues"
Changelog = "https://github.com/OpenMatter-Network/matter-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The online SDK layer (committee client, quorum, chain submission). The crypto
# surface needs none of this; install with `pip install matter-sdk[sdk]`.
# scalecodec is imported directly (matter_sdk/chain.py), so it is declared directly; the
# bounds are the ones substrate-interface itself requires, so the two cannot conflict.
sdk = ["substrate-interface>=1.7", "scalecodec>=1.2.10,<1.3"]

[tool.maturin]
features = ["pyo3/extension-module"]
# Mixed layout: the compiled core is `matter_sdk._native`; the pure-Python
# orchestration layer lives in python/matter_sdk/.
module-name = "matter_sdk._native"
python-source = "python"
