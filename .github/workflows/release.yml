name: Release

# One tag releases npm, PyPI, the Go module and the C-ABI archives (Rust: the tag
# itself; see RELEASING.md).
#
#   gate -> ci -> build -> verify -> [approval] -> publish -> github-release -> postflight
#
# - gate:       tag, manifests and changelog agree; runs before anything is built.
# - build:      every artifact exactly once; no publish rights.
# - verify:     install each artifact from outside the repo on every claimed platform.
# - publish:    uploads the verified bytes, never rebuilds; gated by the `release`
#               environment. Publishers skip what the registry already holds
#               (scripts/lib-registry-state.sh), so recovery is "Re-run failed jobs".
# - postflight: the verify tests again, against the real registries.
#
# workflow_dispatch is a dry run (never publishes); see scripts/release-plan.sh.
# Third-party actions are pinned to a commit SHA: this workflow holds publish rights.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# Two tags must not race their pushes to matter-sdk-go.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash # explicit, so every step runs with -o pipefail

env:
  GO_MODULE: github.com/openmatter-network/matter-sdk-go/v2
  GO_MODULE_REMOTE: git@github.com:openmatter-network/matter-sdk-go.git
  NPM_CORE: "@openmatter-network/matter-sdk-core"
  NPM_CLIENT: "@openmatter-network/matter-sdk"

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      npm_dist_tag: ${{ steps.plan.outputs.npm_dist_tag }}
      pep440: ${{ steps.plan.outputs.pep440 }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Decide what this run releases
        id: plan
        env: # a ref name is attacker-influenced input: passed as data, never interpolated
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: scripts/release-plan.sh "$EVENT_NAME" "$REF_TYPE" "$REF_NAME" | tee -a "$GITHUB_OUTPUT"
      - name: The manifests, the changelog and the licenses agree with it
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          scripts/check-versions.sh --expect "$VERSION"
          scripts/check-license-copies.sh
      - name: Read the platform table
        id: targets
        run: echo "targets=$(jq -c . scripts/native-targets.json)" >> "$GITHUB_OUTPUT"

  # A tag can point at a commit CI never saw.
  ci:
    needs: gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-npm:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/fetch-core-crates
        with:
          token: ${{ secrets.DEPS_PAT }}
      - uses: ./.github/actions/install-rust
        with: { targets: wasm32-unknown-unknown }
      - uses: ./.github/actions/install-wasm-pack
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - name: Build and pack both packages
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          for package in packages/typescript-core packages/typescript; do # the client builds against the core
            (cd "$package" && npm ci && npm run build && npm pack --pack-destination "$RUNNER_TEMP/npm")
          done
      - name: The tarballs are the packages we mean to publish
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          for tarball in "$RUNNER_TEMP"/npm/*.tgz; do scripts/check-npm-tarball.sh "$tarball" "$VERSION"; done
          { echo '### npm tarballs (sha256)'; echo '```'; (cd "$RUNNER_TEMP/npm" && sha256sum -- *.tgz); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

  build-wheels:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(needs.gate.outputs.targets) }}
    runs-on: ${{ matrix.t.build_runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/fetch-core-crates
        with:
          token: ${{ secrets.DEPS_PAT }}
      - uses: ./.github/actions/install-rust
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Build the wheel
        env:
          TARGET: ${{ matrix.t.id }}
        run: |
          pip install -r bindings/python/requirements-release.txt
          scripts/build-python-wheel.sh "$TARGET" "$RUNNER_TEMP/wheels"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.t.id }}
          path: ${{ runner.temp }}/wheels/*.whl
          if-no-files-found: error

  build-ffi:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(needs.gate.outputs.targets) }}
    runs-on: ${{ matrix.t.build_runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/fetch-core-crates
        with:
          token: ${{ secrets.DEPS_PAT }}
      - uses: ./.github/actions/install-rust
      - name: Build the static archive
        env:
          TARGET: ${{ matrix.t.id }}
        run: scripts/build-ffi-staticlib.sh "$TARGET" "$RUNNER_TEMP/ffi"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffi-${{ matrix.t.id }}
          path: ${{ runner.temp }}/ffi/*.a
          if-no-files-found: error

  assemble-go:
    needs: build-ffi
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ffi-*
          merge-multiple: true
          path: ${{ runner.temp }}/ffi
      # Strict: a release never ships a platform short.
      - name: Assemble the module tree
        run: scripts/assemble-go-module.sh "$RUNNER_TEMP/ffi" "$RUNNER_TEMP/go-module"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-module
          path: ${{ runner.temp }}/go-module
          if-no-files-found: error

  # verify-*: no secrets; these jobs only consume artifacts.

  verify-npm:
    needs: build-npm
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ matrix.node }}" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm
      - name: A project outside this repository can install and use both packages
        run: scripts/smoke-npm.sh "$RUNNER_TEMP"/npm/openmatter-network-matter-sdk-core-*.tgz "$RUNNER_TEMP"/npm/openmatter-network-matter-sdk-[0-9]*.tgz

  check-wheels:
    needs: [gate, build-wheels]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          merge-multiple: true
          path: ${{ runner.temp }}/wheels
      # Strict: exactly the wheels the platform table and the version predict.
      - name: The wheels are the set we mean to upload
        env:
          PEP440: ${{ needs.gate.outputs.pep440 }}
        run: |
          pip install -r bindings/python/requirements-release.txt
          scripts/check-wheel.sh "$RUNNER_TEMP/wheels" "$PEP440"

  verify-wheels:
    needs: [gate, build-wheels]
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(needs.gate.outputs.targets) }}
    runs-on: ${{ matrix.t.smoke_runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13" }
      # All wheels: pip's choice tests the platform tags.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          merge-multiple: true
          path: ${{ runner.temp }}/wheels
      - name: A fresh virtualenv can install and use the wheel
        env:
          TARGET: ${{ matrix.t.id }}
        run: scripts/smoke-target.sh python "$TARGET" "$RUNNER_TEMP/wheels"

  verify-go:
    needs: [gate, assemble-go]
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(needs.gate.outputs.targets) }}
    runs-on: ${{ matrix.t.smoke_runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: packages/go/mattersdk/go.mod }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-module
          path: ${{ runner.temp }}/go-module
      - name: A module outside this repository can `go get`, build and run it
        env:
          TARGET: ${{ matrix.t.id }}
        run: scripts/smoke-target.sh go "$TARGET" "$RUNNER_TEMP/go-module"

  # Each publish job needs EVERY verify job: a registry that got ahead of the others
  # cannot be pulled back.

  publish-npm:
    needs: [gate, ci, verify-npm, check-wheels, verify-wheels, verify-go]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC): no token is stored anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm
      - name: Publish the core, then the client that depends on it
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          DIST_TAG: ${{ needs.gate.outputs.npm_dist_tag }}
          TRUSTED_PUBLISHING_MIN_NPM: 11.5.1
        run: |
          oldest=$(printf '%s\n' "$TRUSTED_PUBLISHING_MIN_NPM" "$(npm --version)" | sort -V | head -1)
          [ "$oldest" = "$TRUSTED_PUBLISHING_MIN_NPM" ] || { echo "::error::npm $(npm --version) predates trusted publishing ($TRUSTED_PUBLISHING_MIN_NPM)"; exit 1; }
          # Re-runs skip a package already published (SAME).
          for package in matter-sdk-core matter-sdk; do
            tarball="$RUNNER_TEMP/npm/openmatter-network-$package-$VERSION.tgz"
            state=$(scripts/npm-state.sh "$tarball")
            echo "$package@$VERSION: $state"
            [ "$state" = SAME ] || npm publish "$tarball" --tag "$DIST_TAG"
          done

  publish-pypi:
    needs: [gate, ci, verify-npm, check-wheels, verify-wheels, verify-go]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC): no token is stored anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: What PyPI already holds
        id: pypi
        env:
          PEP440: ${{ needs.gate.outputs.pep440 }}
        run: |
          state=$(scripts/pypi-state.sh dist "$PEP440")
          echo "state=$state" | tee -a "$GITHUB_OUTPUT"
      # skip-existing only when pypi-state proved existing files byte-identical;
      # otherwise a duplicate filename must fail.
      - if: steps.pypi.outputs.state != 'SAME'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: ${{ steps.pypi.outputs.state == 'PARTIAL' }}

  publish-go:
    needs: [gate, ci, verify-npm, check-wheels, verify-wheels, verify-go]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-module
          path: ${{ runner.temp }}/go-module
      - name: Commit and tag the module in matter-sdk-go
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          DEPLOY_KEY: ${{ secrets.GO_REPO_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "::error::GO_REPO_DEPLOY_KEY is not set in the release environment"; exit 1; }
          # A 0600 file outside the checkout, as fetch-core-crates does for its token.
          export GO_REPO_DEPLOY_KEY_FILE="$RUNNER_TEMP/go_repo_deploy_key"
          install -m 600 /dev/null "$GO_REPO_DEPLOY_KEY_FILE"
          printf '%s\n' "$DEPLOY_KEY" > "$GO_REPO_DEPLOY_KEY_FILE"
          scripts/publish-go.sh "$RUNNER_TEMP/go-module" "$VERSION" "$GO_MODULE_REMOTE"

  # Public only once every registry succeeded: drafted, then published last.
  github-release:
    needs: [gate, publish-npm, publish-pypi, publish-go]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ffi-*
          merge-multiple: true
          path: ${{ runner.temp }}/ffi
      # Same archives as the Go module, plus the header.
      - name: Bundle the C-ABI archives
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          mkdir assets
          for archive in "$RUNNER_TEMP"/ffi/libmatter_sdk_ffi_*.a; do
            platform=$(basename "$archive" .a); platform=${platform#libmatter_sdk_ffi_}
            bundle="matter-sdk-ffi-$VERSION-$platform"
            mkdir -p "$bundle/lib" "$bundle/include"
            cp "$archive" "$bundle/lib/libmatter_sdk_ffi.a"
            cp crates/matter-sdk-ffi/include/matter_sdk.h "$bundle/include/"
            cp LICENSE "$bundle/"
            tar -czf "assets/$bundle.tar.gz" "$bundle"
          done
          (cd assets && sha256sum -- *.tar.gz > SHA256SUMS)
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: |
          scripts/changelog-section.sh "$VERSION" > notes.md
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md --prerelease="$PRERELEASE"
          gh release upload "$TAG" assets/* --clobber
          gh release edit "$TAG" --draft=false

  postflight-npm:
    needs: [gate, github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - name: npm install from the public registry
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: scripts/smoke-npm.sh "$NPM_CORE@$VERSION" "$NPM_CLIENT@$VERSION"

  postflight-native:
    needs: [gate, github-release]
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(needs.gate.outputs.targets) }}
    runs-on: ${{ matrix.t.smoke_runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: packages/go/mattersdk/go.mod }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13" }
      # Bounded wait for visibility only; the tests themselves are never retried.
      - name: Wait for the registries to serve the version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          PEP440: ${{ needs.gate.outputs.pep440 }}
          ATTEMPTS: 20
          INTERVAL_SECONDS: 30
        run: |
          visible() {
            GOFLAGS=-mod=mod GOPROXY=https://proxy.golang.org go list -m "$GO_MODULE@v$VERSION" >/dev/null 2>&1 &&
              curl --silent --fail --max-time 20 --output /dev/null "https://pypi.org/pypi/matter-sdk/$PEP440/json"
          }
          for attempt in $(seq "$ATTEMPTS"); do
            if visible; then exit 0; fi
            echo "not visible yet (attempt $attempt of $ATTEMPTS)"; sleep "$INTERVAL_SECONDS"
          done
          echo "::error::v$VERSION is still not visible on the Go proxy and PyPI"; exit 1
      - name: pip install from PyPI
        env:
          TARGET: ${{ matrix.t.id }}
          PEP440: ${{ needs.gate.outputs.pep440 }}
        run: scripts/smoke-target.sh python "$TARGET" "$PEP440"
      - name: go get from the module proxy
        env:
          TARGET: ${{ matrix.t.id }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: scripts/smoke-target.sh go "$TARGET" "v$VERSION"
