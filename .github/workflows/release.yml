name: Release

# Build per-language release artifacts when a version tag (v*) is pushed, e.g.
# v0.1.0. Mirrors matter-node's release flow: the private cryptographic core
# crates are fetched with a read-only PAT (secrets.DEPS_PAT) via the shared
# fetch-core-crates action, not an SSH deploy key. Each job attaches its artifact
# to the GitHub Release for the tag.

permissions:
  contents: write # softprops/action-gh-release creates the release and uploads assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual rebuild / build-only dry run (no tag -> upload steps skip)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Rust / native: the FFI staticlib + cdylib + C header. The consumable artifact
  # for Rust-native and any C-ABI consumer of MatterVault.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: matter-sdk }
      - uses: ./matter-sdk/.github/actions/fetch-core-crates
        with:
          token: ${{ secrets.DEPS_PAT }}
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Build release libraries
        working-directory: matter-sdk
        run: cargo build --workspace --release
      - name: Bundle native FFI artifact
        working-directory: matter-sdk
        run: |
          BUNDLE="matter-vault-ffi-${GITHUB_REF_NAME}-linux-x64"
          mkdir -p "$BUNDLE/lib" "$BUNDLE/include"
          cp target/release/libmatter_vault_ffi.a  "$BUNDLE/lib/"
          cp target/release/libmatter_vault_ffi.so "$BUNDLE/lib/"
          cp crates/matter-vault-ffi/include/matter_vault.h "$BUNDLE/include/"
          tar -czf "${BUNDLE}.tar.gz" "$BUNDLE"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: matter-sdk/matter-vault-ffi-*.tar.gz

  # TypeScript: the npm package tarball (wasm core + compiled TS).
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: matter-sdk }
      - uses: ./matter-sdk/.github/actions/fetch-core-crates
        with:
          token: ${{ secrets.DEPS_PAT }}
      - uses: dtolnay/rust-toolchain@1.93.0
        with: { targets: wasm32-unknown-unknown }
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build and pack the TS package
        working-directory: matter-sdk/packages/typescript
        run: |
          npm ci
          npm run build
          npm pack
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: matter-sdk/packages/typescript/*.tgz
      # To publish to npm instead of attaching the tarball, add an NPM_TOKEN
      # secret, set registry-url on setup-node, and swap `npm pack` for
      # `npm publish --access public` (env NODE_AUTH_TOKEN: secrets.NPM_TOKEN).

  # Python: the maturin-built wheel (abi3, py39+). Below the parity line
  # (docs/parity.md): allowed-fail until the orchestration is ported.
  python:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { path: matter-sdk }
      - uses: ./matter-sdk/.github/actions/fetch-core-crates
        with:
          token: ${{ secrets.DEPS_PAT }}
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build the wheel
        working-directory: matter-sdk/bindings/python
        run: |
          pip install maturin
          maturin build --release --out dist
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: matter-sdk/bindings/python/dist/*.whl

  # Go: the prebuilt FFI staticlib + header bundled with the cgo package, so a
  # downstream `go build` links without a Rust toolchain. Below the parity line.
  go:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { path: matter-sdk }
      - uses: ./matter-sdk/.github/actions/fetch-core-crates
        with:
          token: ${{ secrets.DEPS_PAT }}
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Build FFI staticlib and verify the binding links
        working-directory: matter-sdk
        run: |
          cargo build -p matter-vault-ffi --release
          cd packages/go/mattervault && go build ./...
      - name: Bundle Go artifact
        working-directory: matter-sdk
        run: |
          BUNDLE="matter-vault-go-${GITHUB_REF_NAME}-linux-x64"
          mkdir -p "$BUNDLE/lib" "$BUNDLE/include"
          cp target/release/libmatter_vault_ffi.a "$BUNDLE/lib/"
          cp crates/matter-vault-ffi/include/matter_vault.h "$BUNDLE/include/"
          cp -r packages/go/mattervault "$BUNDLE/mattervault"
          tar -czf "${BUNDLE}.tar.gz" "$BUNDLE"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: matter-sdk/matter-vault-go-*.tar.gz
