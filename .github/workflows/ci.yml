name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The cryptographic core crates (matter-crypto, matter-kgc) are private, pinned
  # as git-tag deps in Cargo.toml/Cargo.lock. Each job runs the fetch-core-crates
  # action first, which configures a git credential helper so cargo's own fetch
  # authenticates over HTTPS with a read-only PAT (secrets.DEPS_PAT).
  FMT_CONFIG: imports_granularity=Module,group_imports=StdExternalCrate,imports_layout=HorizontalVertical

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: matter-sdk }
      - uses: ./matter-sdk/.github/actions/fetch-core-crates
        with:
          token: ${{ secrets.DEPS_PAT }}
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check fmt
        working-directory: matter-sdk
        run: cargo fmt --all --check -- --config ${{ env.FMT_CONFIG }}
      # `matter-vault`'s chain client is behind a default-off `chain` feature, so a
      # single default-feature run would never compile it. Both matrices are gated.
      - name: Clippy (default features)
        working-directory: matter-sdk
        run: cargo clippy --workspace --all-targets -- -Dwarnings
      - name: Clippy (chain feature)
        working-directory: matter-sdk
        run: cargo clippy -p matter-vault --features chain --all-targets -- -Dwarnings
      - name: Build
        working-directory: matter-sdk
        run: cargo build --workspace
      - name: Test (default features)
        working-directory: matter-sdk
        run: cargo test --workspace
      - name: Test (chain feature)
        working-directory: matter-sdk
        run: cargo test -p matter-vault --features chain
      # The `chain` feature must stay opt-out: `matter-ml` consumes this crate by git
      # tag and needs neither subxt nor a tokio runtime. If the heavy subxt client
      # appears in the default graph, the feature gate has leaked.
      - name: Assert subxt stays out of the default dependency graph
        working-directory: matter-sdk
        run: |
          if cargo tree -p matter-vault --edges normal | grep -qE '^[^a-zA-Z]*subxt v[0-9]'; then
            echo "::error::the subxt client leaked into matter-vault's default features"
            cargo tree -p matter-vault --edges normal | grep -E 'subxt'
            exit 1
          fi
      # SECURITY.md promises the `*_insecure_dev_only` helpers never ship in a
      # production target. Library source under src/ is what ships; the definition
      # site, tests/, and examples/ are their only sanctioned homes.
      - name: Assert insecure_dev_only helpers stay out of shipped library code
        working-directory: matter-sdk
        run: |
          hits=$(grep -rln "insecure_dev_only" --include='*.rs' crates/*/src bindings/*/src \
            | grep -v '^crates/matter-vault/src/signer.rs$' || true)
          if [ -n "$hits" ]; then
            echo "::error::insecure_dev_only referenced outside its definition site (see SECURITY.md):"
            echo "$hits"
            exit 1
          fi
      - name: Build cores for wasm32
        working-directory: matter-sdk
        run: |
          cargo build -p matter-vault-core --target wasm32-unknown-unknown
          cargo build -p matter-vault-key --target wasm32-unknown-unknown

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: matter-sdk }
      - uses: ./matter-sdk/.github/actions/fetch-core-crates
        with:
          token: ${{ secrets.DEPS_PAT }}
      - uses: dtolnay/rust-toolchain@1.93.0
        with: { targets: wasm32-unknown-unknown }
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build wasm + TS package and run vector conformance
        working-directory: matter-sdk/packages/typescript
        run: |
          npm ci
          npm run build
          npm test
      # matter-vault advertises zero runtime dependencies, and the chain client
      # lives in a separate package precisely to keep that true. Assert it.
      - name: Assert matter-vault has no runtime dependencies
        working-directory: matter-sdk/packages/typescript
        run: |
          deps=$(npm ls --omit=dev --depth=0 --parseable 2>/dev/null | tail -n +2)
          if [ -n "$deps" ]; then
            echo "::error::matter-vault gained a runtime dependency:"
            echo "$deps"
            exit 1
          fi
      - name: Build and test the chain client
        working-directory: matter-sdk/packages/typescript-client
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

  # Python and Go are gating now: every row in docs/parity.md is ✅, so a failure here
  # is a real regression rather than an unfinished port.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: matter-sdk }
      - uses: ./matter-sdk/.github/actions/fetch-core-crates
        with:
          token: ${{ secrets.DEPS_PAT }}
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # `maturin develop` shells out to `uv pip`, which is unavailable in some
      # environments; build-then-install always works and is what the README documents.
      # `substrate-interface` is needed for the chain, client, and façade tests —
      # without it they silently skip, which would make this job pass vacuously.
      - name: Build the extension and run the full suite
        working-directory: matter-sdk/bindings/python
        run: |
          pip install maturin pytest 'substrate-interface>=1.7'
          maturin build --release
          pip install --force-reinstall --no-deps target/wheels/matter_vault-*.whl
          pytest -q
      # The chain, client, and façade tests guard on `pytest.importorskip`, so a
      # missing substrate-interface would make this job pass with them all skipped.
      - name: Assert the chain tests were not silently skipped
        working-directory: matter-sdk/bindings/python
        run: |
          python -c "import substrateinterface" || {
            echo "::error::substrate-interface missing; the chain tests would skip"
            exit 1
          }

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: matter-sdk }
      - uses: ./matter-sdk/.github/actions/fetch-core-crates
        with:
          token: ${{ secrets.DEPS_PAT }}
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Build the FFI library and run the full Go suite
        working-directory: matter-sdk
        run: |
          cargo build -p matter-vault-ffi --release
          cd packages/go/mattervault
          gofmt -l . | tee /tmp/unformatted
          test ! -s /tmp/unformatted || { echo "::error::gofmt would reformat these"; exit 1; }
          go vet ./...
          go test ./...
      # The examples are part of the surface: a client example that stops compiling
      # is a broken quick-start, and nothing else in CI builds them.
      - name: Build the Go examples
        working-directory: matter-sdk
        run: |
          for example in examples/go-e2e examples/client-go; do
            (cd "$example" && go build ./...)
          done
