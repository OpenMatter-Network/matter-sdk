name: Fetch core crates
description: >
  Authenticate cargo's git fetch of the private cryptographic core crates
  (matter-crypto, matter-kgc), which the workspace pins as `git+ssh://` tag
  dependencies (see Cargo.toml / Cargo.lock). Configures a git credential helper
  that reads a read-only GitHub PAT from a job-scoped file — the same file-backed
  flow matter-node's release uses for its DEPS_PAT. The token is never written to
  a clone URL or to ~/.gitconfig (which stores only the helper's path reference).

inputs:
  token:
    description: PAT with read access to the openmatter-network core repositories.
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate cargo git fetch for the private core deps
      shell: bash
      env:
        DEPS_PAT: ${{ inputs.token }}
      run: |
        set -euo pipefail
        test -n "${DEPS_PAT}" || { echo "::error::core-deps PAT is empty — secret not delivered to this job"; exit 1; }
        # Persist the token to a 0600 file *outside* the checkout so it survives
        # past this step (cargo fetches the deps in later build steps) yet cannot be
        # swept into `git add` or an upload-artifact. printf avoids a trailing newline
        # that would corrupt the password.
        TOKEN_FILE="${RUNNER_TEMP}/deps_pat"
        install -m 600 /dev/null "${TOKEN_FILE}"
        printf '%s' "${DEPS_PAT}" > "${TOKEN_FILE}"
        # Rewrite the release-form `ssh://git@github.com/...` cargo git deps to HTTPS
        # (.cargo/config.toml sets git-fetch-with-cli, so cargo shells to git and
        # honors this global config). The helper reads the token from the file at
        # each fetch; the absolute path is baked in now so it does not depend on
        # RUNNER_TEMP being set when git later invokes the helper.
        git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        git config --global credential.helper \
          "!f() { echo username=x-access-token; echo \"password=\$(cat '${TOKEN_FILE}')\"; }; f"
